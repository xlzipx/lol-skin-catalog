name: macOS build

# PyInstaller cannot cross-compile, so the Mac package has to be produced on a
# Mac. Pushing a version tag builds it here and attaches it to that release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to, e.g. v1.11.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and attach the macOS package
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Smoke test before packaging anything
        run: python tests/smoke_test.py

      - name: Build
        run: python build.py

      - name: Check the binary and the launcher
        run: |
          unzip -q dist/LoL-Skin-Catalog-macOS.zip -d /tmp/check
          # unzip honours the stored mode, so this also proves the execute bit
          # survived packaging rather than being restored by hand here
          test -x "/tmp/check/LoL-Skin-Catalog" || { echo "binary not executable"; exit 1; }
          test -x "/tmp/check/Start on macOS.command" || { echo "launcher not executable"; exit 1; }
          "/tmp/check/LoL-Skin-Catalog" --help
          bash -n "/tmp/check/Start on macOS.command"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" \
            "dist/LoL-Skin-Catalog-macOS.zip#LoL-Skin-Catalog.zip (macOS)" \
            --clobber

      - name: Keep the package as an artifact too
        uses: actions/upload-artifact@v4
        with:
          name: LoL-Skin-Catalog-macOS
          path: dist/LoL-Skin-Catalog-macOS.zip
